<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#17372c" />
    <title data-text="app.title"> </title>
    <link rel="modulepreload" href="text.js" />
    <link rel="modulepreload" href="text-format.js" />
    <link rel="modulepreload" href="campaign.js" />
    <link rel="icon" href="../assets/kojax.png" />
    <link rel="stylesheet" href="campaign.css" />
  </head>
  <body>
    <main id="world" data-label="app.title">
      <canvas id="scene" aria-hidden="true"> </canvas>
      <div
        id="cells"
        role="group"
        data-label="accessibility.movementArea"
        tabindex="0"
      ></div>
      <section
        id="rescueScore"
        class="rescue-score"
        role="status"
        aria-live="polite"
        hidden
      >
        <h2 data-rescue="title"></h2>
        <strong data-rescue="steps"></strong>
        <p data-rescue="attempts"></p>
      </section>
      <header class="hud">
        <div class="score" data-label="accessibility.score">
          <span title="" data-label="accessibility.attempts"
            >↺ <b id="attempts">1</b>
          </span>
          <span title="" data-label="accessibility.steps"
            >🐾 <b id="steps">0</b>
          </span>
        </div>
        <nav data-label="accessibility.controls">
          <button
            id="sound"
            title="Mute sound"
            aria-label="Mute sound"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h4l5-4v14l-5-4H4z" />
              <path class="sound-waves" d="M16 8q4 4 0 8" />
              <path class="sound-off" d="M4 3 21 21" />
            </svg>
          </button>
          <button
            id="fullscreen"
            title=""
            data-label="accessibility.enterFullscreen"
            aria-pressed="false"
          >
            ⤢
          </button>
          <button id="help" title="" data-label="accessibility.help">?</button>
          <button id="reset" title="" data-label="buttons.restartCrossing">
            ↺
          </button>
        </nav>
      </header>
      <div id="status" role="status" aria-live="polite" class="sr-only"></div>
      <div id="loading">
        <div class="startup-card">
          <div class="dialog-body">
            <span class="loading-paw" aria-hidden="true">✦</span>
            <span class="eyebrow" data-text="app.eyebrow"> </span>
            <h1 data-text="app.loadingTitle"></h1>
            <p id="loadCount" data-text="app.loadingSubtitle"></p>
          </div>
        </div>
      </div>
    </main>
    <dialog id="dialog">
      <div id="dialogContent"></div>
    </dialog>
    <script type="module" src="boot.js"></script>
  </body>
</html>
